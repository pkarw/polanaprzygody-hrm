<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Makiety UI — moduł patient (PAT/VIS)</title>
<style>
  :root{
    --primary:#2A5C47; --primary-fg:#EFF1C5; --primary-hover:#1E4435;
    --bg:#ffffff; --fg:#252525; --muted:#f7f7f7; --muted-fg:#767676;
    --border:#e6e6e6; --sidebar:#fbfbfb; --ring:#2A5C47;
    --radius:10px;
    --ok-bg:#e9f6ef; --ok-fg:#1c5c3e; --ok-bd:#bfe3d0;
    --warn-bg:#fffaeb; --warn-fg:#624c18; --warn-bd:#f6b51e;
    --info-bg:#ebf8ff; --info-fg:#124b68; --info-bd:#47c2ff;
    --purple-bg:#efebff; --purple-fg:#351a75; --purple-bd:#cac0ff;
    --gray-bg:#f2f2f2; --gray-fg:#5a5a5a; --gray-bd:#dedede;
    --red-bg:#fdecec; --red-fg:#8c2018; --red-bd:#f3b7b2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#eceef0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
  .frame{background:#fff;margin:28px auto;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .caption{background:#111827;color:#fff;padding:10px 18px;display:flex;gap:14px;align-items:baseline;font-size:12.5px}
  .caption b{font-size:14px;letter-spacing:.2px}
  .caption .rt{font-family:ui-monospace,Menlo,monospace;color:#b9f2c8}
  .caption .sp{margin-left:auto;color:#9aa4b2}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:0}
  /* sidebar */
  .sb{background:var(--sidebar);border-right:1px solid var(--border);padding:14px 10px}
  .logo{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;font-weight:650;font-size:14px}
  .logo .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#B4F372,#EEFB63 45%,#BC9AFF)}
  .sbgroup{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-fg);padding:12px 9px 5px}
  .sbi{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;color:#4a4a4a}
  .sbi .ic{width:15px;text-align:center;opacity:.65;font-size:12px}
  .sbi.active{background:var(--primary);color:var(--primary-fg);font-weight:600}
  .sbi.active .ic{opacity:1}
  .sbi .cnt{margin-left:auto;font-size:11px;color:var(--muted-fg)}
  /* topbar */
  .top{display:flex;align-items:center;gap:12px;padding:11px 22px;border-bottom:1px solid var(--border)}
  .crumbs{font-size:12.5px;color:var(--muted-fg)}
  .crumbs b{color:var(--fg);font-weight:600}
  .topsearch{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--muted-fg);width:250px;background:var(--muted)}
  .org{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:12.5px}
  .av{width:28px;height:28px;border-radius:50%;background:#dcd6ff;color:#351a75;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:650}
  /* page */
  .main{display:flex;flex-direction:column;min-width:0}
  .body{padding:20px 22px 26px;flex:1}
  .ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
  .ph h1{margin:0;font-size:21px;font-weight:660;letter-spacing:-.2px}
  .ph .sub{margin:4px 0 0;font-size:12.5px;color:var(--muted-fg)}
  .ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{border:1px solid var(--border);background:#fff;border-radius:var(--radius);padding:7px 12px;font-size:12.5px;font-weight:550;color:#3a3a3a;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  .btn.p{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
  .btn.d{border-color:var(--red-bd);color:var(--red-fg)}
  .btn.sm{padding:4px 9px;font-size:11.5px;border-radius:8px}
  .btn.off{opacity:.45}
  .btn.link{border:0;background:none;color:var(--primary);text-decoration:underline;padding:4px 2px}
  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:2px 0 18px}
  .tab{padding:9px 13px;font-size:13px;color:var(--muted-fg);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
  .tab .n{background:var(--muted);border-radius:20px;padding:1px 6px;font-size:10.5px;color:var(--muted-fg)}
  .tab.active{color:var(--fg);font-weight:620;border-bottom-color:var(--primary)}
  .tab.active .n{background:var(--ok-bg);color:var(--ok-fg)}
  .tab.soon{opacity:.55}
  /* filters */
  .filters{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .sel,.inp{border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:12.5px;background:#fff;color:#3a3a3a;display:inline-flex;align-items:center;gap:8px}
  .sel .cv{color:var(--muted-fg);font-size:10px}
  .inp.grow{flex:1;min-width:230px;color:var(--muted-fg)}
  .inp .mag{opacity:.5}
  /* card */
  .card{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
  .card+.card{margin-top:14px}
  .card .hd{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .card .hd h3{margin:0;font-size:13.5px;font-weight:640}
  .card .hd .r{margin-left:auto;display:flex;gap:8px}
  .card .ct{padding:15px}
  .hint{font-size:11.5px;color:var(--muted-fg);margin-top:5px}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-fg);font-weight:600;padding:9px 14px;background:#fcfcfc;border-bottom:1px solid var(--border)}
  td{padding:11px 14px;border-bottom:1px solid #f1f1f1;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#4a4a4a}
  .nm{font-weight:600}
  .sub2{color:var(--muted-fg);font-size:11.5px;margin-top:2px}
  .rowacts{display:flex;gap:6px;justify-content:flex-end}
  .dim td{background:#fcfcfc;color:var(--muted-fg)}
  /* badges */
  .b{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;border:1px solid transparent}
  .b.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
  .b.gray{background:var(--gray-bg);color:var(--gray-fg);border-color:var(--gray-bd)}
  .b.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
  .b.info{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-bd)}
  .b.purple{background:var(--purple-bg);color:var(--purple-fg);border-color:var(--purple-bd)}
  .b.red{background:var(--red-bg);color:var(--red-fg);border-color:var(--red-bd)}
  .bs{display:flex;gap:5px;flex-wrap:wrap}
  /* banners */
  .banner{display:flex;gap:11px;padding:11px 14px;border-radius:11px;font-size:12.5px;border:1px solid;margin-bottom:14px;line-height:1.45}
  .banner .i{font-weight:700}
  .banner.info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-fg)}
  .banner.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-fg)}
  .banner.red{background:var(--red-bg);border-color:var(--red-bd);color:var(--red-fg)}
  /* form */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px 16px}
  .f label{display:block;font-size:11.5px;font-weight:600;margin-bottom:5px;color:#3d3d3d}
  .f label .req{color:#a1231a}
  .f .in{border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;background:#fff;min-height:36px;display:flex;align-items:center;justify-content:space-between}
  .f .in.ph{color:#a8a8a8}
  .f .in.ta{min-height:66px;align-items:flex-start}
  .f .in.err{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.12)}
  .f .errtxt{color:#a1231a;font-size:11.5px;margin-top:4px}
  .f .in.ro{background:var(--muted);color:var(--muted-fg)}
  .sw{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .sw .tr{width:34px;height:19px;border-radius:20px;background:#d8d8d8;position:relative}
  .sw .tr.on{background:var(--primary)}
  .sw .tr i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff}
  .sw .tr.on i{left:17px}
  .cb{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
  .cb .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid #c9c9c9;background:#fff}
  .cb .bx.on{background:var(--primary);border-color:var(--primary);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  .split{display:grid;grid-template-columns:1fr 316px;gap:16px;align-items:start}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f4f4f4;font-size:12.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted-fg)}
  .kv .v{font-weight:550;text-align:right}
  .sectitle{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-fg);font-weight:650;margin:0 0 9px}
  /* dialog */
  .stage{position:relative}
  .scrim{position:absolute;inset:0;background:rgba(15,20,25,.38)}
  .dlg{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:500px;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden}
  .dlg .dh{padding:14px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center}
  .dlg .dh h3{margin:0;font-size:14.5px;font-weight:650}
  .dlg .dh .x{margin-left:auto;color:var(--muted-fg)}
  .dlg .dc{padding:16px 17px;display:flex;flex-direction:column;gap:13px}
  .dlg .df{padding:12px 17px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;background:#fcfcfc}
  .dlg .df .kbd{margin-right:auto;font-size:11px;color:var(--muted-fg)}
  kbd{font-family:ui-monospace,Menlo,monospace;background:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:10.5px}
  /* combobox list */
  .cbox{border:1px solid var(--ring);border-radius:9px;box-shadow:0 0 0 3px rgba(42,92,71,.12)}
  .cbox .q{padding:8px 11px;font-size:13px;border-bottom:1px solid var(--border)}
  .cbox .opt{padding:8px 11px;font-size:12.5px;display:flex;align-items:center;gap:9px}
  .cbox .opt.hl{background:#f3f7f4}
  .cbox .opt .mini{color:var(--muted-fg);font-size:11.5px;margin-left:auto}
  /* timeline */
  .tl{position:relative;padding-left:20px}
  .tl:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--border)}
  .tl .it{position:relative;padding:0 0 13px}
  .tl .it:before{content:"";position:absolute;left:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:#c9c9c9;border:2px solid #fff}
  .tl .it.now:before{background:var(--primary)}
  .tl .t1{font-size:12.5px;font-weight:600}
  .tl .t2{font-size:11.5px;color:var(--muted-fg)}
  .pager{display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-fg)}
  .pager .r{margin-left:auto;display:flex;gap:6px}
  .chip{background:var(--muted);border:1px solid var(--border);border-radius:7px;padding:2px 8px;font-size:11.5px;display:inline-flex;gap:6px;align-items:center}
  .empty{text-align:center;padding:44px 20px}
  .empty .ei{width:44px;height:44px;border-radius:12px;background:var(--muted);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:19px}
  .empty h4{margin:0 0 5px;font-size:14.5px}
  .empty p{margin:0 0 14px;font-size:12.5px;color:var(--muted-fg)}
  .skel{background:linear-gradient(90deg,#f1f1f1,#f8f8f8,#f1f1f1);border-radius:6px;height:11px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  .three .mini-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-fg);font-weight:650;margin-bottom:8px}
  .phone{width:360px;border:1px solid var(--border);border-radius:0;background:#fff}
  .ptop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
  .pbody{padding:14px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .plist .row{border:1px solid var(--border);border-radius:11px;padding:11px 12px}
  .ptabs{display:flex;gap:6px;overflow:hidden;border-bottom:1px solid var(--border);padding:0 14px}
  .ptabs .tab{padding:8px 4px;font-size:12px}
  .aria{font-size:11px;color:var(--muted-fg);line-height:1.8;margin-top:10px}
  #s06 td:first-child,#s09 td:first-child,#s08 td:nth-child(5){white-space:nowrap}
  .note{font-size:11.5px;color:var(--muted-fg);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div id="out"></div>
<script>

  ${[['data','Dane i pola dodatkowe',''],['addr','Adresy','2'],['cont','Kontakty','3'],['diag','Diagnozy','4'],['docs','Dokumenty','2'],['files','Pliki','5'],['vis','Wizyty','7']]

const PATIENT_HEAD = `
<div class="ph">

    <h1>Zofia Kaczmarek <span class="b ok" style="vertical-align:5px">Aktywna</span></h1>

  </div>

    <button class="btn">Archiwizuj</button>

</div>`;

/* ───────────────────────── 01 — lista pacjentów ───────────────────────── */
S({id:'s01',w:1440,label:'Lista pacjentów',route:'/backend/patient/patients',spec:'PAT-R01/R07 · PAT-J1 · DataTable patient:patient',

        <tbody>

              <td><div class="nm">Zofia Kaczmarek</div><div class="sub2">ur. 2017-04-12 · 3 kontakty CRM</div></td>
              <td>z.kaczmarek@example.org<div class="sub2">+48 601 234 567</div></td>
              <td>Anna Nowicka</td><td><span class="b ok">Aktywna</span></td>
              <td class="r"><div class="rowacts"><button class="btn sm">Otwórz kartę</button><button class="btn sm">⋯</button></div></td></tr>
          <tr><td class="mono">P-3b7109ac</td>
              <td><div class="nm">Jan Lewandowski</div><div class="sub2">ur. 2019-11-02 · 2 kontakty CRM</div></td>
              <td>—<div class="sub2">+48 512 880 145 (telefon opiekuna, wpisany świadomie)</div></td>
              <td>Marek Zieliński</td><td><span class="b ok">Aktywny</span></td>
              <td class="r"><div class="rowacts"><button class="btn sm">Otwórz kartę</button><button class="btn sm">⋯</button></div></td></tr>
          <tr><td class="mono">P-51d0e7b4</td>
              <td><div class="nm">Maja Wiśniewska</div><div class="sub2">ur. 2015-06-30 · 1 kontakt CRM</div></td>
              <td>m.wisniewska@example.org<div class="sub2">—</div></td>
              <td><span style="color:var(--muted-fg)">Nie przypisano</span></td><td><span class="b ok">Aktywna</span></td>

          <tr><td class="mono">P-c4a9f200</td>

              <td>Anna Nowicka</td><td><span class="b ok">Aktywny</span></td>
              <td class="r"><div class="rowacts"><button class="btn sm">Otwórz kartę</button><button class="btn sm">⋯</button></div></td></tr>
          <tr><td class="mono">P-77be1c05</td>
              <td><div class="nm">Antoni Dąbrowski</div><div class="sub2">ur. 2020-08-08 · 2 kontakty CRM</div></td>
              <td>—<div class="sub2">+48 604 112 900</div></td>

              <td class="r"><div class="rowacts"><button class="btn sm">Otwórz kartę</button><button class="btn sm">⋯</button></div></td></tr>
          <tr class="dim"><td class="mono">P-1e6633fd</td>
              <td><div class="nm">Helena Sikora</div><div class="sub2">ur. 2013-01-24 · archiwum od 2026-03-11</div></td>
              <td>h.sikora@example.org<div class="sub2">+48 666 100 210</div></td>
              <td>Marek Zieliński</td><td><span class="b gray">Archiwalna</span></td>

      </table>
      <div class="pager">Wyświetlono 1–6 z 42 · rozmiar strony <b>25</b>

    <div class="note">Wyszukiwanie jest dokładne (szyfrowane pola, indeksy hashowane) — nie ma dopasowania częściowego ani sortowania po treści. Eksport nie zawiera treści klinicznej.</div>
  </div>
